<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="importmap">
    {
    	"imports": {
     		"codemirror": "https://esm.sh/codemirror",
        "@codemirror/view": "https://esm.sh/@codemirror/view",
        "@codemirror/lang-html": "https://esm.sh/@codemirror/lang-html",
        "@fsegurai/codemirror-theme-vscode-dark": "https://esm.sh/@fsegurai/codemirror-theme-vscode-dark"
     	}
    }
    </script>
    <title>Component Playground</title>
    <script type="module" vite-ignore>
    	import {basicSetup} from "codemirror"
     	import {EditorView} from "@codemirror/view"
      import {html} from "@codemirror/lang-html"
      import { vsCodeDark } from '@fsegurai/codemirror-theme-vscode-dark'

      customElements.define("component-repl", class extends HTMLElement {
        connectedCallback() {
        	const root = document.createElement('div');
         	root.id = "output";

        	const codeblock = document.createElement('div');
        	codeblock.id = "codeblock";

         	const btn = document.createElement('button');
				 	btn.textContent = "Update";
					btn.id = "update-btn";

					const codeAndButtonWrapper = document.createElement('div');
					codeAndButtonWrapper.id = "code-and-button-wrapper";

					[codeblock, btn].forEach(it => codeAndButtonWrapper.appendChild(it));

          [codeAndButtonWrapper, root].forEach(it => this.appendChild(it));
          console.log(basicSetup)
         	const view = new EditorView({
           	doc: "\n<ol-hello-world></ol-hello-world> <!-- Edit this code and click Update to see the result here. -->\n",
            parent: codeblock,
            extensions: [basicSetup, html(), vsCodeDark]
          })
          btn.addEventListener('click', () => {
						root.innerHTML = view.state.doc.toString();
					});
          root.innerHTML = view.state.doc.toString();
        }
      });
    </script>
    <style>
    	* {
      	box-sizing: border-box;
     }
    	body {
      	margin: 0;
			 	padding: 0;
			 	height: 100svh;
			 	display: flex;
			 	flex-direction: column;
				background-color: #1e1e1e;
				color: #eee;
     }

    	component-repl {
     		display: flex;
        flex-direction: column;
        gap: 1em;
        padding: 1.5rem;
				height: 100svh;

				#codeblock {
					width: 100%;
					border: 1px solid #333;
				}

				#output {
					min-height: 50px;
					height: 100%;
					overflow: scroll;
					background-color: white;
					color: #000;
				}

				#code-and-button-wrapper {
					display: flex;
					flex-direction: row;
					gap: 0.5em;
					justify-content: center;
					align-items: center;
				}

     	}
    </style>
    <!-- head -->
  </head>
  <body>
  	<component-repl></component-repl>
  </body>
</html>
